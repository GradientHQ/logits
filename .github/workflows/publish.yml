name: Publish

on:
  push:
    tags:
      - "v*"  # pushing a release tag (e.g. v0.1.1) publishes to PyPI
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      repository:
        description: "Repository to publish to"
        required: true
        default: "testpypi"
        type: choice
        options:
          - testpypi
          - pypi

permissions:
  contents: read

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history + tags so hatch-vcs can resolve the version

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build package
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine
          python -m build
          python -m twine check dist/*

      - name: Guard — version not already on PyPI / tag matches build
        if: github.event_name == 'release' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.repository == 'pypi')
        run: |
          WHEEL=$(find dist -maxdepth 1 -name '*.whl' -print -quit)
          VER=$(printf '%s\n' "$WHEEL" | sed -E 's#.*/logits_sdk-([^-]+)-.*#\1#')
          echo "Built version: $VER"
          case "$VER" in
            *.dev*|*+*) echo "::error::refusing to publish a dev/local version ($VER) — tag a clean release commit"; exit 1 ;;
          esac
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME#v}" != "$VER" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match built version $VER"; exit 1
          fi
          if curl -sf "https://pypi.org/pypi/logits-sdk/${VER}/json" >/dev/null; then
            echo "::error::logits-sdk $VER is already on PyPI — bump the tag"; exit 1
          fi

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

  publish-testpypi:
    name: Publish to TestPyPI
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.repository == 'testpypi'
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish distributions to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    name: Publish to PyPI
    needs: build
    if: github.event_name == 'release' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.repository == 'pypi')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
