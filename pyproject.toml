[project]
name = "logits-sdk"
dynamic = ["version"]
description = "The official Python SDK for the Logits platform (import as `logits`)"
readme = "README.md"
authors = [{ name = "Gradient", email = "support@gradient.ai" }]
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "tinker>=0.21,<0.22",
]
keywords = ["logits", "logits-sdk", "tinker", "training", "sampling"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/GradientHQ/logits"
Repository = "https://github.com/GradientHQ/logits"
Issues = "https://github.com/GradientHQ/logits/issues"
Documentation = "https://github.com/GradientHQ/logits#readme"

[dependency-groups]
dev = [
    "pytest",
    "pytest-timeout",
    "respx",
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

# Version comes from the git tag (e.g. tag `v0.1.2` -> version `0.1.2`).
# Never edit a version by hand; tag the release commit and CI builds from it.
[tool.hatch.version]
source = "vcs"

# Dev builds (commits after a tag) get `0.1.2.dev3` with no `+gSHA` local
# segment, so TestPyPI accepts them. Release builds (tag on HEAD) stay clean.
[tool.hatch.version.raw-options]
local_scheme = "no-local-version"

[tool.hatch.build.targets.wheel]
packages = ["src/logits"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
timeout = 15
timeout_method = "thread"
